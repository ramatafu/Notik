Summary: Минималистичные заметки с акцентом на приватность
Description: |
    Notik — это простой и приватный блокнотик для ваших заметок.

    Особенности:
    * 📝 Заметки с форматированием (жирный, курсив, моноширинный)
    * ✅ Чек-листы
    * 🎂 Дни рождения с напоминаниями
    * 🔒 Защита заметок паролем
    * 🌙 Светлая и тёмная тема
    * 📦 Резервное копирование и восстановление из ZIP
    * 📤 Экспорт в TXT, JSON, HTML, PDF
    * 🌐 Поддержка русского и английского языков

    Приложение полностью офлайн и не требует доступа в интернет.
    Все данные хранятся только на вашем устройстве.

